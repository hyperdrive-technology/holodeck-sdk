# Pre-1.0 CI policy (Des, 2026-11-03): nothing runs automatically (no push/schedule triggers).
# PR jobs run only when the PR has the `ci` label (adding it starts a run; every push then runs).
# Every event on a `ci` PR runs in full, adding an unrelated label included: a skipped run would
# publish the required check names as skipped (= passing) and could mask a failure (GPT review,
# holodeck-sdk#45 / wormhole#26).
# or on demand with
# `gh workflow run <this file> --ref <branch>` (~/dev/hyperdrive/scripts/ci-run.sh). Minor changes
# are checked locally instead and recorded with ~/dev/hyperdrive/scripts/ci-local-status.sh, which
# also satisfies required checks whose jobs were skipped. Policy: ~/dev/hyperdrive/AGENTS.md.
name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-typescript:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    name: Test TypeScript
    runs-on: boat
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4

      # pnpm 12 (ts/package.json packageManager; the lockfile is pnpm 12 format). It
      # fails the install on dependency build scripts not approved in
      # ts/pnpm-workspace.yaml `allowBuilds`.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm type-check
      - name: Test
        run: pnpm exec vitest run
      - name: Build
        run: pnpm build
      # ESM-only package: load the build BY NAME (through the exports map) by import and by
      # Node's require(esm) — a relative path would skip exports and miss a missing `default`;
      # which also proves there is no top-level await.
      - name: Smoke-test built package (import + require(esm))
        run: |
          node --input-type=module -e "const m = await import('@holodeck/sdk'); if (typeof m.HolodeckHost !== 'function') throw new Error('import failed')"
          node -e "const m = require('@holodeck/sdk'); if (typeof m.HolodeckHost !== 'function') throw new Error('require(esm) failed')"
      # Lint is not run: there is no ESLint config in ts/ yet (eslint 8 exits 2 with
      # "no configuration found"). Add an eslint.config.js and a step here when ready.

  validate-schema:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    name: Validate JSON Schema
    # Three ajv runs, no install: the 2-vCPU size is plenty.
    runs-on: boat-small
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # `ajv validate` needs -d data; `compile` checks the schema itself.
      # ajv-formats is needed for "date-time" etc. (strict mode rejects unknown formats).
      - name: Compile schema
        run: npx -y -p ajv-cli@5 -p ajv-formats@3 ajv compile -c ajv-formats -s schema/scenefile.schema.json
      - name: Compile package and document schemas (draft 2020-12)
        run: npx -y -p ajv-cli@5 -p ajv-formats@3 ajv compile --spec=draft2020 -c ajv-formats -s schema/holodeck-package.v1.schema.json -s schema/holodeck-document.v1.schema.json
      - name: Validate example package manifests
        run: npx -y -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 -c ajv-formats -s schema/holodeck-package.v1.schema.json -d "examples/packages/*.holodeck.package.json"
