name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-typescript:
    name: Test TypeScript (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json engines is >=18; test the current LTS lines. 26 is what the
        # holodeck repo CI uses, so the SDK is exercised on the same runtime.
        node-version: [24, 26]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4

      # pnpm 10.26+ is required: ts/pnpm-workspace.yaml uses `allowBuilds`
      # (older pnpm rejects the file with "packages field missing or empty").
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm type-check
      - name: Test
        run: pnpm exec vitest run
      - name: Build
        run: pnpm build
      # Lint is not run: there is no ESLint config in ts/ yet (eslint 8 exits 2 with
      # "no configuration found"). Add an eslint.config.js and a step here when ready.

  validate-schema:
    name: Validate JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # `ajv validate` needs -d data; `compile` checks the schema itself.
      # ajv-formats is needed for "date-time" etc. (strict mode rejects unknown formats).
      - name: Compile schema
        run: npx -y -p ajv-cli@5 -p ajv-formats@3 ajv compile -c ajv-formats -s schema/scenefile.schema.json
