# Pre-1.0 CI policy (Des, 2026-11-03; dev-loop shift-left 2026-11-11): nothing runs
# automatically. PR jobs run only on a `labeled` event of a PR that has the `ci` label:
# adding `ci` (or any label to a `ci` PR) starts one run; pushes do NOT re-run. Heavy CI is
# run once, by whoever merges, on the final reviewed head of a major PR
# (~/dev/hyperdrive/scripts/ci-run.sh re-labels to trigger it). A push after that leaves the
# new head without check runs, which blocks merge until CI is triggered again.
# Every event on a `ci` PR runs in full, adding an unrelated label included: a skipped run
# would publish the required check names as skipped (= passing) and could mask a failure
# (GPT review, holodeck-sdk#45 / wormhole#26).
# Minor changes are checked locally instead: `scripts/dev-check.sh full` runs these same
# commands (scripts/dev-check.test.mjs pins the two lists) and writes .dev-check/last.json,
# which ~/dev/hyperdrive/scripts/ci-local-status.sh posts as `ci/local`. Ladder: TESTING.md.
name: Test

on:
  pull_request:
    types: [labeled]
    branches: [main]

  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-typescript:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    name: Test TypeScript
    runs-on: boat
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4

      # pnpm 12 (ts/package.json packageManager; the lockfile is pnpm 12 format). It
      # fails the install on dependency build scripts not approved in
      # ts/pnpm-workspace.yaml `allowBuilds`.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # Sources and tests (tsconfig.check.json).
      - name: Type check
        run: pnpm type-check
      - name: Test
        run: pnpm exec vitest run
      - name: dev-check self-tests (selection logic + this workflow's command list)
        working-directory: .
        run: node --test "scripts/*.test.mjs"
      - name: Build
        run: pnpm build
      # ESM-only package: load the build BY NAME (through the exports map) by import and by
      # Node's require(esm); see ts/scripts/smoke-dist.mjs.
      - name: Smoke-test built package (import + require(esm))
        run: pnpm run smoke:dist
      # Lint is not run: there is no ESLint config in ts/ yet (eslint 8 exits 2 with
      # "no configuration found"). Add an eslint.config.js and a step here when ready.

  validate-schema:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci')
    name: Validate JSON Schema
    # One install + three ajv runs: the 2-vCPU size is plenty.
    runs-on: boat-small
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # ajv-cli / ajv-formats are pinned devDependencies (no `npx -y` download per run).
      # Compiles scenefile (draft-07) and the package/document schemas (draft 2020-12) and
      # validates every examples/packages/*.holodeck.package.json; see ts/package.json.
      - name: Compile schemas and validate example package manifests
        run: pnpm run validate:schema
