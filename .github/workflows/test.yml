name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4

      # pnpm 10.26+ is required: ts/pnpm-workspace.yaml uses `allowBuilds`
      # (older pnpm rejects the file with "packages field missing or empty").
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm type-check
      - name: Test
        run: pnpm exec vitest run
      - name: Build
        run: pnpm build
      # ESM-only package: load the build by import and by Node's require(esm),
      # which also proves there is no top-level await.
      - name: Smoke-test built package (import + require(esm))
        run: |
          node --input-type=module -e "const m = await import('./dist/index.js'); if (typeof m.HolodeckHost !== 'function') throw new Error('import failed')"
          node -e "const m = require('./dist/index.js'); if (typeof m.HolodeckHost !== 'function') throw new Error('require(esm) failed')"
      # Lint is not run: there is no ESLint config in ts/ yet (eslint 8 exits 2 with
      # "no configuration found"). Add an eslint.config.js and a step here when ready.

  validate-schema:
    name: Validate JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # `ajv validate` needs -d data; `compile` checks the schema itself.
      # ajv-formats is needed for "date-time" etc. (strict mode rejects unknown formats).
      - name: Compile schema
        run: npx -y -p ajv-cli@5 -p ajv-formats@3 ajv compile -c ajv-formats -s schema/scenefile.schema.json
      - name: Compile package and document schemas (draft 2020-12)
        run: npx -y -p ajv-cli@5 -p ajv-formats@3 ajv compile --spec=draft2020 -c ajv-formats -s schema/holodeck-package.v1.schema.json -s schema/holodeck-document.v1.schema.json
      - name: Validate example package manifests
        run: npx -y -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 -c ajv-formats -s schema/holodeck-package.v1.schema.json -d "examples/packages/*.holodeck.package.json"
