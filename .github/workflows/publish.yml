name: Publish Packages

# Tag-only: PR / main checks live in test.yml. The tests run again here on purpose:
# they gate the publish of exactly the tagged commit.
#
# Runs on boat.dev like the rest of CI. `npm publish` authenticates with the
# NPM_TOKEN secret, which works on any runner. Do NOT add `--provenance` (or
# `publishConfig.provenance`) while publish-npm is on boat: npm only issues
# provenance attestations from GitHub-hosted runners and fails the publish on a
# self-hosted one. If provenance is wanted, move publish-npm alone to a
# GitHub-hosted runner and give it `permissions: id-token: write`.
on:
  push:
    tags:
      - 'v*'

jobs:
  test-typescript:
    name: Test TypeScript Package
    runs-on: boat
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
          
      - name: Install dependencies
        run: |
          cd ts
          pnpm install --frozen-lockfile
          
      - name: Type check
        run: |
          cd ts
          pnpm type-check
          
      - name: Build
        run: |
          cd ts
          pnpm build
          
      - name: Test
        run: |
          cd ts
          pnpm exec vitest run

  publish-npm:
    name: Publish to NPM
    runs-on: boat
    timeout-minutes: 15
    # The schema gate blocks the publish too (it used to run alongside without gating it).
    needs: [test-typescript, validate-schema]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: |
          cd ts
          pnpm install --frozen-lockfile
          
      - name: Build
        run: |
          cd ts
          pnpm build
          
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: Update package version
        run: |
          cd ts
          npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version
          
      - name: Publish to NPM
        run: |
          cd ts
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  validate-schema:
    name: Validate JSON Schema
    runs-on: boat-small
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same command as test.yml (pinned ajv-cli devDependency, no npx download).
      - name: Compile schemas and validate example package manifests
        run: pnpm run validate:schema
