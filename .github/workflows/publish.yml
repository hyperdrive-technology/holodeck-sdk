name: Publish Packages

# Tag-only: PR / main checks live in test.yml.
on:
  push:
    tags:
      - 'v*'

jobs:
  test-typescript:
    name: Test TypeScript Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
          
      - name: Install dependencies
        run: |
          cd ts
          pnpm install --frozen-lockfile
          
      - name: Type check
        run: |
          cd ts
          pnpm type-check
          
      - name: Build
        run: |
          cd ts
          pnpm build
          
      - name: Test
        run: |
          cd ts
          pnpm exec vitest run

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [test-typescript]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: |
          cd ts
          pnpm install --frozen-lockfile
          
      - name: Build
        run: |
          cd ts
          pnpm build
          
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: Update package version
        run: |
          cd ts
          npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version
          
      - name: Publish to NPM
        run: |
          cd ts
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  validate-schema:
    name: Validate JSON Schema
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Compile schema
        run: npx -y -p ajv-cli@5 -p ajv-formats@3 ajv compile -c ajv-formats -s schema/scenefile.schema.json
