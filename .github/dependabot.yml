version: 2
updates:
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - "area:sdk"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - "area:ci"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
